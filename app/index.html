<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Fiszki — hiszpański</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div x-data="flashcardsApp()" x-init="init()">
    <template x-if="!db">
      <main class="welcome">
        <div class="welcome-card">
          <div class="brand-mark">ñ</div>
          <p class="eyebrow">TWOJA PRZESTRZEŃ DO NAUKI</p>
          <h1>Hiszpański,<br><span>karta po karcie.</span></h1>
          <p class="welcome-copy">Fiszki, które zostają na Twoim komputerze. Wybierz plik SQLite, aby rozpocząć — Twoje dane nigdy nie opuszczają tej przeglądarki.</p>
          <div class="welcome-actions">
            <button class="button primary" @click="openDatabase()">Otwórz bazę</button>
            <button class="button secondary" @click="createDatabase()">Utwórz bazę</button>
          </div>
          <button class="text-button" @click="$refs.dbInput.click()">Wybierz plik bazy z dysku</button>
          <button class="text-button" x-show="savedHandle" @click="resumeDatabase()">Wznów ostatnią bazę</button>
          <div class="welcome-note"><span class="status-dot"></span><span x-text="initMessage || 'SQLite działa lokalnie w tej przeglądarce'"></span></div>
          <p class="small muted">Przy otwarciu przez file:// niektóre przeglądarki blokują bezpośredni zapis. Wtedy użyj zwykłego wyboru pliku i pobierania kopii — bez serwera. Najlepiej działa aktualny Chrome lub Edge.</p>
          <input x-ref="dbInput" class="visually-hidden" type="file" accept=".sqlite,.sqlite3,.db,application/vnd.sqlite3" @change="openSelectedFile($event)">
        </div>
        <div class="welcome-art"><div class="art-circle"></div><div class="art-card art-one">hola <span>cześć</span></div><div class="art-card art-two">el viaje <span>podróż</span></div><div class="art-card art-three">☀</div><span class="art-caption">POCO A POCO</span></div>
        <div class="toast" :class="toast.type" x-show="toast.text" x-transition x-text="toast.text"></div>
      </main>
    </template>
    <template x-if="db">
      <div class="app-shell">
        <aside class="sidebar">
          <a class="brand" href="#" @click.prevent="navigate('dashboard')"><span class="brand-mark small-mark">ñ</span><span>fiszki<span class="brand-sub">ESPAÑOL</span></span></a>
          <p class="nav-label">NAUKA</p>
          <nav aria-label="Nawigacja główna">
            <template x-for="item in navItems" :key="item.id">
              <button class="nav-item" :class="view===item.id?'active':''" @click="navigate(item.id)"><span class="nav-icon" x-text="item.icon"></span><span x-text="item.label"></span><span class="nav-badge" x-show="item.id==='study' && queueCount" x-text="queueCount"></span></button>
            </template>
          </nav>
          <div class="sidebar-bottom">
            <div class="database-chip"><span class="status-dot"></span><div><strong x-text="fileName || 'Baza lokalna'"></strong><small x-text="saveFailed?'Błąd ostatniego zapisu':persistent?'Zapis automatyczny':'Tylko w pamięci'"></small></div></div>
          </div>
        </aside>
        <main class="main-area">
          <header class="topbar">
            <div><span class="breadcrumb">FISZKI <span>/</span></span><span class="breadcrumb-current" x-text="currentLabel"></span></div>
            <div class="topbar-right"><span class="save-indicator" :class="persistent&&!saveFailed?'saved':saveFailed?'error':'volatile'"><i></i><span x-text="saveFailed?'Błąd zapisu':persistent?'Zapisano':'Brak aktywnego pliku'"></span></span><button class="avatar" aria-label="Panel">ES</button></div>
          </header>
          <section class="page">
            <div class="notice" x-show="!persistent"><span>ⓘ</span><div><strong>Zmiany nie są jeszcze zapisane w pliku.</strong> Użyj „Pobierz kopię SQLite” w sekcji Dane i kopie, aby zachować bazę na dysku.</div></div>

            <section x-show="view==='dashboard'">
              <div class="page-heading"><div><p class="eyebrow">MARTES · <span x-text="todayLabel"></span></p><h1>¡Hola! <span class="wave">✳</span></h1><p class="muted">Każdy dzień to dobry dzień na nowe słowo.</p></div><div class="heading-actions"><button class="button secondary" @click="openImportPicker()">Importuj fiszki</button><button class="button primary" @click="startStudy()">Rozpocznij naukę <span>→</span></button></div></div>
              <div class="stats-grid">
                <article class="stat-card accent-stat"><div class="stat-top"><span>Wszystkie fiszki</span><span class="stat-icon">▤</span></div><strong x-text="stats.total"></strong><small>kart w Twojej kolekcji</small><div class="stat-line"><i :style="`width:${stats.total?Math.min(100,stats.known/stats.total*100):0}%`"></i></div></article>
                <article class="stat-card"><div class="stat-top"><span>Do powtórki dziś</span><span class="stat-icon yellow">◷</span></div><strong x-text="dueCount"></strong><small>kart z terminem dziś lub zaległych</small><button class="inline-link" @click="navigate('study')">Przejdź do nauki →</button></article>
                <article class="stat-card"><div class="stat-top"><span>Poznane fiszki</span><span class="stat-icon green">✓</span></div><strong x-text="stats.known"></strong><small>z co najmniej jedną dobrą odpowiedzią</small><div class="stat-progress"><i :style="`width:${stats.total?stats.known/stats.total*100:0}%`"></i></div></article>
                <article class="stat-card"><div class="stat-top"><span>Wszystkie powtórki</span><span class="stat-icon blue">↻</span></div><strong x-text="stats.reviews"></strong><small>udzielonych odpowiedzi łącznie</small></article>
              </div>
              <div class="dashboard-grid">
                <article class="panel-card due-card"><div class="panel-head"><div><p class="eyebrow">TWÓJ PLAN</p><h2>Na dziś</h2></div><span class="pill" x-text="`${queueCount} ${plural(queueCount,'karta','karty','kart')}`"></span></div><template x-if="queueCount"><div class="due-content"><div class="mini-stack"><span>á</span><span>ñ</span><span>¿</span></div><div><strong>Gotowy na krótką sesję?</strong><p class="muted">Najpierw powtórki, potem nowe słowa.</p></div><button class="icon-button" aria-label="Rozpocznij naukę" @click="startStudy()">→</button></div></template><template x-if="!queueCount"><div class="empty-inline"><span>✦</span><strong>Na dziś wszystko gotowe.</strong><p>Dodaj fiszki albo wróć jutro po kolejną porcję.</p></div></template></article>
                <article class="panel-card"><div class="panel-head"><div><p class="eyebrow">KONTYNUUJ</p><h2>Ostatnie odpowiedzi</h2></div><button class="inline-link" @click="navigate('progress')">Wszystkie →</button></div><template x-if="recent.length"><div class="recent-list"><template x-for="row in recent.slice(0,4)" :key="row.id"><div class="recent-row"><span class="recent-word" x-text="row.spanish_word"></span><span class="recent-meaning" x-text="row.polish_translation"></span><span class="quality-badge" :class="qualityClass(row.quality)" x-text="qualityLabel(row.quality)"></span></div></template></div></template><p class="muted empty-copy" x-show="!recent.length">Twoja historia nauki pojawi się tutaj.</p></article>
              </div>
            </section>

            <section x-show="view==='study'">
              <div class="page-heading"><div><p class="eyebrow">RUTYNA, KTÓRA DZIAŁA</p><h1>Sesja nauki</h1><p class="muted">Spokojnie — jedno słowo na raz.</p></div><button class="button secondary" x-show="studyActive" @click="endStudy()">Zakończ sesję</button></div>
              <template x-if="studyActive && studyCard"><div class="study-wrap"><div class="session-meta"><span><i class="live-dot"></i> W TRAKCIE SESJI</span><span><b x-text="sessionCompleted"></b> ukończonych <span class="meta-divider">·</span> <b x-text="studyQueue.length"></b> pozostało</span></div><div class="session-progress"><i :style="`width:${sessionTotal?sessionCompleted/sessionTotal*100:0}%`"></i></div><article class="flashcard"><div class="flashcard-top"><span class="pill" x-text="studyCard.category_name || 'Bez kategorii'"></span><span class="card-rank" x-text="studyCard.is_due?'POWTÓRKA':'NOWA FISZKA'"></span></div><div class="flashcard-image" :style="studyCard.image_url?`background-image:linear-gradient(0deg,rgba(0,0,0,.38),transparent),url('${safeCssUrl(studyCard.image_url)}')`:''"><span x-show="!studyCard.image_url" class="image-placeholder">✳</span><div class="translation"><span>PO POLSKU</span><h2 x-text="studyCard.polish_translation"></h2></div></div><template x-if="!answerShown"><div class="reveal-area"><p>Jak brzmi to słowo po hiszpańsku?</p><button class="button primary reveal-button" @click="answerShown=true">Pokaż odpowiedź <span>⌄</span></button></div></template><template x-if="answerShown"><div class="answer-area"><div class="answer-title"><div><p class="eyebrow">PO HISZPAŃSKU</p><h2 x-text="studyCard.spanish_word"></h2><p class="ipa" x-show="studyCard.ipa_word" x-text="studyCard.ipa_word"></p></div><button class="audio-button" x-show="speechAvailable" aria-label="Odtwórz wymowę" @click="speak(studyCard.spanish_word)">🔊</button></div><div class="answer-tags"><span x-show="studyCard.part_of_speech" x-text="studyCard.part_of_speech"></span><span x-show="studyCard.gender" x-text="studyCard.gender"></span></div><div class="example" x-show="studyCard.spanish_sentence"><p x-text="studyCard.spanish_sentence"></p><small x-show="studyCard.ipa_sentence" x-text="studyCard.ipa_sentence"></small><div class="example-footer"><span x-text="studyCard.polish_sentence"></span><button class="audio-button small-audio" x-show="speechAvailable" aria-label="Odtwórz zdanie" @click="speak(studyCard.spanish_sentence)">🔊</button></div></div><p class="rate-prompt">Jak dobrze pamiętałeś?</p><div class="rating-buttons"><button class="rate-button rate-bad" @click="rateCard(1)"><b>1</b><span>Nie znam</span></button><button class="rate-button rate-hard" @click="rateCard(3)"><b>3</b><span>Trudne</span></button><button class="rate-button rate-good" @click="rateCard(4)"><b>4</b><span>Znam</span></button><button class="rate-button rate-easy" @click="rateCard(5)"><b>5</b><span>Łatwe</span></button></div></div></template></article><p class="session-hint">Wskazówka: powtarzaj na głos, aby zapamiętać wymowę.</p></div></template><template x-if="!studyActive || !studyCard"><div class="panel-card study-empty"><div class="empty-illustration">✦</div><p class="eyebrow">DOBRA ROBOTA</p><h2 x-text="sessionCompleted?'Sesja ukończona!':'Czas na pierwszą fiszkę'"></h2><p class="muted" x-text="sessionCompleted?`Ukończono ${sessionCompleted} ${plural(sessionCompleted,'kartę','karty','kart')}. Wróć po kolejną porcję.`:'Dodaj słowa do swojej kolekcji i rozpocznij naukę.'"></p><button class="button primary" @click="navigate('cards')">Przejdź do fiszek →</button></div></template></section>

            <section x-show="view==='cards'">
              <div class="page-heading"><div><p class="eyebrow">TWOJA KOLEKCJA</p><h1>Fiszki <span class="heading-count" x-text="cardsTotal"></span></h1><p class="muted">Wszystkie Twoje słowa w jednym miejscu.</p></div><div class="heading-actions"><button class="button secondary" @click="openImportPicker()">Importuj fiszki</button><button class="button primary" @click="openCardForm()">＋ Dodaj fiszkę</button></div></div>
              <div class="toolbar"><label class="search-field"><span>⌕</span><input type="search" placeholder="Szukaj po hiszpańsku lub polsku…" x-model="search" @input="pageNo=1;loadCards()"></label><select class="select-control" aria-label="Filtr kategorii" x-model="categoryFilter" @change="pageNo=1;loadCards()"><option value="all">Wszystkie kategorie</option><option value="none">Bez kategorii</option><template x-for="cat in categories" :key="cat.id"><option :value="String(cat.id)" x-text="cat.name"></option></template></select><select class="select-control" aria-label="Sortowanie" x-model="sortBy" @change="loadCards()"><option value="rank">Kolejność</option><option value="spanish_word">Hiszpański</option><option value="part_of_speech">Część mowy</option><option value="gender">Rodzaj</option><option value="category_name">Kategoria</option></select></div>
              <div class="table-card"><div class="table-scroll"><table><thead><tr><th>SŁOWO / IPA</th><th>TŁUMACZENIE</th><th>CZĘŚĆ MOWY</th><th>RODZAJ</th><th>KATEGORIA</th><th>POZ.</th><th></th></tr></thead><tbody><template x-for="card in cards" :key="card.id"><tr><td><strong x-text="card.spanish_word"></strong><small x-show="card.ipa_word" x-text="card.ipa_word"></small></td><td x-text="card.polish_translation"></td><td x-text="card.part_of_speech || '—'"></td><td><span class="gender" x-show="card.gender" x-text="card.gender"></span><span x-show="!card.gender">—</span></td><td><span class="category-tag" x-show="card.category_name" x-text="card.category_name"></span><span x-show="!card.category_name">—</span></td><td class="rank-cell" x-text="card.rank"></td><td><div class="row-actions"><button class="icon-button" title="Podgląd fiszki" @click="viewCard(card)">◎</button><button class="icon-button" title="Edytuj fiszkę" @click="openCardForm(card)">✎</button><button class="icon-button danger-icon" title="Usuń fiszkę" @click="deleteCard(card)">×</button></div></td></tr></template></tbody></table><div class="empty-table" x-show="!cards.length"><span>⌕</span><p x-text="search?'Nie znaleziono pasujących fiszek.':'Nie masz jeszcze fiszek. Dodaj pierwszą!'"></p><button class="button secondary" x-show="!search" @click="openCardForm()">Dodaj fiszkę</button></div></div><div class="pagination" x-show="cardsTotal"><span x-text="`Pokazano ${Math.min((pageNo-1)*50+1,cardsTotal)}–${Math.min(pageNo*50,cardsTotal)} z ${cardsTotal}`"></span><div><button class="page-button" :disabled="pageNo<=1" @click="pageNo--;loadCards()">← Poprzednia</button><span x-text="`${pageNo} / ${Math.max(1,Math.ceil(cardsTotal/50))}`"></span><button class="page-button" :disabled="pageNo>=Math.ceil(cardsTotal/50)" @click="pageNo++;loadCards()">Następna →</button></div></div></div>
            </section>

            <section x-show="view==='progress'">
              <div class="page-heading"><div><p class="eyebrow">MAŁE KROKI, DUŻY POSTĘP</p><h1>Twoje postępy</h1><p class="muted">Każda powtórka przybliża Cię do celu.</p></div></div>
              <div class="stats-grid progress-stats"><article class="stat-card"><div class="stat-top"><span>Wszystkie odpowiedzi</span><span class="stat-icon blue">↻</span></div><strong x-text="stats.reviews"></strong><small>powtórek łącznie</small></article><article class="stat-card"><div class="stat-top"><span>Do powtórzenia dziś</span><span class="stat-icon yellow">◷</span></div><strong x-text="dueCount"></strong><small>zaległe lub zaplanowane na dziś</small></article><article class="stat-card"><div class="stat-top"><span>Zaplanowane później</span><span class="stat-icon green">⌁</span></div><strong x-text="stats.future"></strong><small>kart z terminem w przyszłości</small></article><article class="stat-card"><div class="stat-top"><span>Poznane fiszki</span><span class="stat-icon">✦</span></div><strong x-text="stats.known"></strong><small>kart z poprawną odpowiedzią</small></article></div>
              <div class="dashboard-grid progress-grid"><article class="panel-card chart-card"><div class="panel-head"><div><p class="eyebrow">OSTATNIE 7 DNI</p><h2>Aktywność</h2></div><span class="chart-legend"><i></i> Powtórki</span></div><div class="chart" role="img" aria-label="Liczba powtórek w ostatnich siedmiu dniach"><template x-for="day in chartDays" :key="day.key"><div class="chart-column"><span class="chart-value" x-text="day.count || ''"></span><div class="chart-track"><i :style="`height:${Math.max(day.count?8:2,day.count/maxChart*100)}%`"></i></div><span class="chart-day" x-text="day.label"></span></div></template></div></article><article class="panel-card"><div class="panel-head"><div><p class="eyebrow">NAJNOWSZE</p><h2>Ostatnie odpowiedzi</h2></div><span class="pill">12 wpisów</span></div><div class="review-list"><template x-for="row in recent" :key="row.id"><div class="review-row"><div><strong x-text="row.spanish_word"></strong><small x-text="row.polish_translation"></small></div><span class="quality-badge" :class="qualityClass(row.quality)" x-text="qualityLabel(row.quality)"></span><time x-text="formatDate(row.reviewed_at)"></time></div></template><p class="muted empty-copy" x-show="!recent.length">Brak odpowiedzi — rozpocznij naukę, aby zobaczyć postępy.</p></div></article></div>
            </section>

            <section x-show="view==='categories'">
              <div class="page-heading"><div><p class="eyebrow">UPORZĄDKUJ SWOJĄ NAUKĘ</p><h1>Kategorie</h1><p class="muted">Twórz własne grupy słówek.</p></div><button class="button primary" @click="openCategoryForm()">＋ Nowa kategoria</button></div>
              <div class="category-grid"><template x-for="cat in categories" :key="cat.id"><article class="category-card"><div class="category-card-top"><span class="category-symbol" x-text="categorySymbol(cat.name)"></span><div class="row-actions"><button class="icon-button" title="Zmień nazwę" @click="openCategoryForm(cat)">✎</button><button class="icon-button danger-icon" title="Usuń kategorię" @click="deleteCategory(cat)">×</button></div></div><h2 x-text="cat.name"></h2><p class="muted" x-text="`${cat.card_count} ${plural(cat.card_count,'fiszka','fiszki','fiszek')}`"></p><button class="inline-link" @click="categoryFilter=String(cat.id);navigate('cards')">Zobacz fiszki →</button></article></template><div class="empty-card" x-show="!categories.length"><span>▦</span><h2>Stwórz pierwszą kategorię</h2><p>Grupuj fiszki według tematów, które lubisz.</p><button class="button secondary" @click="openCategoryForm()">Nowa kategoria</button></div></div>
            </section>

            <section x-show="view==='data'">
              <div class="page-heading"><div><p class="eyebrow">TWOJE DANE, TWOJE ZASADY</p><h1>Dane i kopie</h1><p class="muted">Zarządzaj lokalną bazą i twórz kopie bezpieczeństwa.</p></div></div>
              <div class="data-layout"><div class="data-main">
                <article class="panel-card database-panel"><div><p class="eyebrow">AKTYWNA BAZA SQLITE</p><h2 x-text="fileName || 'Baza w pamięci przeglądarki'"></h2><p class="muted" x-text="saveFailed?'Ostatni zapis się nie powiódł. Sprawdź uprawnienia do pliku i spróbuj ponownie.':persistent?'Połączona — zmiany są zapisywane automatycznie.':'Brak aktywnego pliku — zmiany istnieją wyłącznie do zamknięcia strony.'"></p></div><span class="database-status" :class="persistent&&!saveFailed?'ok':''" x-text="saveFailed?'BŁĄD ZAPISU':persistent?'POŁĄCZONA':'TYLKO PAMIĘĆ'"></span></article>
                <article class="panel-card data-section"><div class="panel-head"><div><p class="eyebrow">PRZENOSZENIE DANYCH</p><h2>Import i eksport</h2></div><span class="data-icon">⇄</span></div><div class="action-list"><div class="action-row"><div><strong>Importuj fiszki</strong><p>Wczytaj plik CSV lub JSON. Podgląd przed zapisem.</p></div><button class="button secondary" @click="openImportPicker()">Wybierz plik</button></div><div class="action-row"><div><strong>Eksportuj fiszki JSON</strong><p>Wersjonowany plik z kategoriami i fiszkami.</p></div><button class="button secondary" @click="exportJson(false)">Eksportuj</button></div><div class="action-row"><div><strong>Kopia całej bazy JSON</strong><p>Fiszki, kategorie, postępy i historia powtórek.</p></div><button class="button secondary" @click="exportJson(true)">Pobierz kopię</button></div><div class="action-row"><div><strong>Pobierz kopię SQLite</strong><p>Pełny snapshot bazy w formacie SQLite.</p></div><button class="button secondary" @click="downloadDatabase()">Pobierz .sqlite</button></div><div class="action-row" x-show="!persistent"><div><strong>Otwórz / wybierz bazę</strong><p>Wybierz plik, aby włączyć zapis bezpośrednio na dysku.</p></div><button class="button secondary" @click="openDatabase()">Otwórz bazę</button></div></div></article>
                <article class="panel-card data-section"><div class="panel-head"><div><p class="eyebrow">DOSTĘP LOKALNY</p><h2>Bezpieczeństwo pliku</h2></div><span class="data-icon">⌑</span></div><p class="muted">Baza SQLite jest przechowywana na Twoim urządzeniu. Przeglądarka nie wysyła fiszek do sieci. W trybie bez dostępu do zapisu użyj pobierania kopii.</p><button class="text-button left-text" @click="createDatabase()">Utwórz nową bazę</button></article>
                <article class="panel-card danger-panel"><p class="eyebrow">STREFA DESTRUKCYJNA</p><div class="danger-row"><div><h2>Reset bazy fiszek</h2><p>Usunie wszystkie fiszki, historię i postępy. Kategorie zostaną zachowane.</p></div><button class="button danger-button" @click="resetDialog=true;resetPhrase=''">Resetuj bazę</button></div></article>
              </div><aside class="data-aside"><div class="privacy-card"><span class="privacy-icon">◈</span><h3>Twoje dane pozostają Twoje.</h3><p>Plik SQLite nie jest przesyłany na żaden serwer. Masz nad nim pełną kontrolę.</p><div class="privacy-separator"></div><span class="privacy-label">FORMAT EKSPORTU</span><strong>JSON · wersja 1</strong><small>fiszki-hiszpanski</small></div></aside></div>
              <input x-ref="importInput" class="visually-hidden" type="file" accept=".csv,.json,text/csv,application/json" @change="prepareImport($event)">
            </section>
          </section>
        </main>

        <div class="modal-backdrop" x-show="cardDialog" x-transition @click.self="cardDialog=null" @keydown.escape.window="cardDialog=null">
          <section class="modal modal-wide" role="dialog" aria-modal="true" :aria-label="editingCard?'Edytuj fiszkę':'Dodaj fiszkę'"><div class="modal-head"><div><p class="eyebrow" x-text="editingCard?'TWOJA KOLEKCJA':'NOWA FISZKA'"></p><h2 x-text="editingCard?'Edytuj fiszkę':'Dodaj fiszkę'"></h2></div><button class="icon-button" aria-label="Zamknij" @click="cardDialog=null">×</button></div><form @submit.prevent="saveCard()">          <div class="form-grid"><label>Pozycja w kolejce<input type="number" min="1" step="1" x-model="cardForm.rank"><small class="field-error" x-text="formErrors.rank"></small></label><label>Słowo / zwrot po hiszpańsku <i>*</i><input required x-model="cardForm.spanish_word" placeholder="np. buenos días"><small class="field-error" x-text="formErrors.spanish_word"></small></label><label>Transkrypcja IPA<input maxlength="255" x-model="cardForm.ipa_word" placeholder="/ˈbwenos ˈdi.as/"><small class="field-error" x-text="formErrors.ipa_word"></small></label><label>Tłumaczenie po polsku <i>*</i><textarea maxlength="1000" required x-model="cardForm.polish_translation" placeholder="np. dzień dobry"></textarea><small class="field-error" x-text="formErrors.polish_translation"></small></label><label>Przykładowe zdanie po hiszpańsku<textarea maxlength="2000" x-model="cardForm.spanish_sentence"></textarea><small class="field-error" x-text="formErrors.spanish_sentence"></small></label><label>Transkrypcja IPA zdania<input maxlength="1000" x-model="cardForm.ipa_sentence"></label><label>Tłumaczenie przykładu po polsku<textarea maxlength="2000" x-model="cardForm.polish_sentence"></textarea><small class="field-error" x-text="formErrors.polish_sentence"></small></label><label>Część mowy<input maxlength="100" x-model="cardForm.part_of_speech" placeholder="np. rzeczownik"></label><label>Rodzaj<select x-model="cardForm.gender"><option value="">Nie dotyczy</option><option value="męski">Męski</option><option value="żeński">Żeński</option></select></label><label>Kategoria<select x-model="cardForm.category_id"><option value="">Bez kategorii</option><template x-for="cat in categories" :key="cat.id"><option :value="String(cat.id)" x-text="cat.name"></option></template></select></label><label class="full-field">Adres obrazka<input type="url" x-model="cardForm.image_url" placeholder="https://…"><small class="field-error" x-text="formErrors.image_url"></small></label></div><div class="modal-actions"><button type="button" class="button secondary" @click="cardDialog=null">Anuluj</button><button class="button primary" type="submit" x-text="editingCard?'Zapisz zmiany':'Dodaj fiszkę'"></button></div></form></section>
        </div>

        <div class="modal-backdrop" x-show="previewCard" x-transition @click.self="previewCard=null" @keydown.escape.window="previewCard=null"><section class="modal" role="dialog" aria-modal="true" aria-label="Podgląd fiszki"><div class="modal-head"><div><p class="eyebrow">PODGLĄD FISZKI</p><h2 x-text="previewCard?.spanish_word"></h2></div><button class="icon-button" aria-label="Zamknij" @click="previewCard=null">×</button></div><p class="preview-meaning" x-text="previewCard?.polish_translation"></p><div class="preview-details"><div x-show="previewCard?.ipa_word"><small>IPA</small><span x-text="previewCard?.ipa_word"></span></div><div x-show="previewCard?.part_of_speech"><small>CZĘŚĆ MOWY</small><span x-text="previewCard?.part_of_speech"></span></div><div x-show="previewCard?.gender"><small>RODZAJ</small><span x-text="previewCard?.gender"></span></div><div x-show="previewCard?.category_name"><small>KATEGORIA</small><span x-text="previewCard?.category_name"></span></div><div x-show="previewCard?.spanish_sentence"><small>PRZYKŁADOWE ZDANIE</small><span x-text="previewCard?.spanish_sentence"></span></div><div x-show="previewCard?.ipa_sentence"><small>IPA ZDANIA</small><span x-text="previewCard?.ipa_sentence"></span></div><div x-show="previewCard?.polish_sentence"><small>TŁUMACZENIE ZDANIA</small><span x-text="previewCard?.polish_sentence"></span></div><div x-show="previewCard?.image_url"><small>ADRES OBRAZKA</small><span x-text="previewCard?.image_url"></span></div><div><small>POZYCJA W KOLEJCE</small><span x-text="previewCard?.rank"></span></div></div><div class="modal-actions"><button class="button secondary" @click="previewCard=null">Zamknij</button><button class="button primary" @click="openCardForm(previewCard);previewCard=null">Edytuj fiszkę</button></div></section></div>

        <div class="modal-backdrop" x-show="categoryDialog" x-transition @click.self="categoryDialog=null" @keydown.escape.window="categoryDialog=null"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><p class="eyebrow">ORGANIZACJA</p><h2 x-text="editingCategory?'Zmień nazwę':'Nowa kategoria'"></h2></div><button class="icon-button" @click="categoryDialog=null">×</button></div><form @submit.prevent="saveCategory()"><label>Nazwa kategorii<input maxlength="100" required x-model="categoryName" placeholder="np. Podróże" x-ref="categoryNameInput"><small class="field-error" x-text="categoryError"></small></label><div class="modal-actions"><button type="button" class="button secondary" @click="categoryDialog=null">Anuluj</button><button class="button primary">Zapisz</button></div></form></section></div>

        <div class="modal-backdrop" x-show="importPreview" x-transition @click.self="importPreview=null" @keydown.escape.window="importPreview=null"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><p class="eyebrow">PODGLĄD IMPORTU</p><h2>Sprawdź dane</h2></div><button class="icon-button" @click="importPreview=null">×</button></div><p class="muted" x-text="importSummary"></p><div class="import-preview-list"><template x-for="(row,index) in importPreview?.items?.slice(0,5) || []" :key="index"><div><span x-text="row.spanish_word"></span><small x-text="row.polish_translation"></small></div></template><template x-for="(row,index) in importPreview?.skipped || []" :key="`skip-${index}`"><div class="skipped-row"><span x-text="`Wiersz ${row.line}${row.word?' · '+row.word:''}`"></span><small x-text="`${row.reason}${row.existingRank?` · istniejący rank: ${row.existingRank}`:''}`"></small></div></template></div><div class="import-warning" x-show="importPreview?.items?.length">Import pomija duplikaty. Dane zostaną zapisane po potwierdzeniu.</div><div class="modal-actions"><button class="button secondary" @click="importPreview=null">Anuluj</button><button class="button primary" :disabled="!importPreview?.items?.length" @click="commitImport()">Importuj fiszki</button></div></section></div>

        <div class="modal-backdrop" x-show="resetDialog" x-transition @click.self="resetDialog=false" @keydown.escape.window="resetDialog=false"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><p class="eyebrow danger-eyebrow">UWAGA · DESTRUKCYJNA ZMIANA</p><h2>Reset bazy fiszek</h2></div><button class="icon-button" @click="resetDialog=false">×</button></div><p>Usunięte zostaną wszystkie karty, postępy nauki oraz historia odpowiedzi. Kategorie zostaną zachowane.</p><label>Wpisz dokładnie <code>restart bazy</code><input x-model="resetPhrase" autocomplete="off"></label><div class="modal-actions"><button class="button secondary" @click="resetDialog=false">Anuluj</button><button class="button danger-button" :disabled="resetPhrase!=='restart bazy'" @click="resetDatabase()">Resetuj bazę</button></div></section></div>
        <div class="toast" :class="toast.type" x-show="toast.text" x-transition x-text="toast.text" role="status"></div>
      </div>
    </template>
    <div class="fatal-error" x-show="initError"><strong>Nie udało się uruchomić SQLite.</strong><span x-text="initError"></span></div>
  </div>
  <script src="vendor/sql-wasm-blob.js"></script>
  <script src="vendor/sql-wasm.js"></script>
  <script src="app.js"></script>
  <script src="vendor/alpine.min.js"></script>
</body>
</html>
